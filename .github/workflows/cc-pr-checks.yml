# Added by Codebase Command: runs the test suite on every pull request into cc-base,
# so agent pull requests get a CI result (jackson's own workflow only covers master, 3.0 and 2.18).
name: Codebase Command PR checks
on:
  pull_request:
    branches: [cc-base]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp test
